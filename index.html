<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELITE V17 - ALL BRANCHES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}
body{background:#080b1e;color:#e8e8f0;min-height:100vh}
.header{position:sticky;top:0;z-index:50;background:#080b1e;border-bottom:1px solid #1e2a5a;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;color:#f5c542;cursor:pointer;font-size:14px}
.btn{padding:10px 14px;border:none;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer}
.btnG{background:linear-gradient(135deg,#f5c542,#ffb300);color:#000}
.btnD{background:#1a2244;color:#fff;border:1px solid #2a3a7a}
.wrap{max-width:900px;margin:0 auto;padding:10px}
.card{background:#121633;border:1px solid #1e2a5a;border-radius:18px;padding:14px;margin:10px 0}
.title2{text-align:center;font-weight:900;color:#fff;margin:12px 0;font-size:16px;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch{
background:linear-gradient(180deg,#1a1d33,#121528);
border:1px solid #1e2a5a;
border-radius:16px;
padding:16px 8px;
text-align:center;
cursor:pointer;
transition:.2s;
box-shadow:0 4px 12px #0006;
}
.branch:hover{border-color:#f5c54266;transform:translateY(-2px)}
.branch b{font-size:13px;color:#e8e8f0;display:block;margin-bottom:6px}
.branch small{color:#7a85b5;font-size:11px}
.statTop{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.statTop span{background:#1a2244;border:1px solid #2a3a7a;padding:5px 10px;border-radius:20px;font-size:11px}
.tabs{display:flex;gap:6px;overflow:auto;padding:6px 2px}
.tab{background:#1a2244;border:1px solid #2a3a7a;padding:9px 14px;border-radius:20px;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.tab.active{background:#f5c542;color:#000}
.input{width:100%;padding:12px;background:#0e1430;border:1px solid #2a3a7a;border-radius:12px;color:#fff;margin:6px 0;outline:none}
.label{font-size:11px;color:#7a85b5;margin:6px 2px;display:block;font-weight:700}
.item{background:#0e1430;border:1px solid #1e2a5a;border-radius:14px;padding:12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.itemFull{background:#0e1430;border:1px solid #1e2a5a;border-radius:14px;padding:14px;margin:8px 0;font-size:12px}
.badge{background:#1a2244;padding:4px 10px;border-radius:20px;font-size:10px;border:1px solid #2a3a7a;display:inline-block;margin:2px}
.progress{height:8px;background:#0e1430;border-radius:10px;overflow:hidden;margin-top:8px;border:1px solid #1e2a5a}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#f5c542,#ffb300);width:0%;transition:.5s}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal.show{display:flex}
.sheet{background:#1a2044;border:1px solid #2a3a7a;width:100%;max-width:420px;border-radius:18px;padding:16px;max-height:92vh;overflow:auto}
.hidden{display:none!important}
.selectBox{position:relative}
.selectBox::after{content:'▼';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7a85b5;pointer-events:none;font-size:10px}
.passBox{background:#1a0f00;border:1px solid #f5c54255;padding:6px 10px;border-radius:8px;color:#f5c542;word-break:break-all;font-family:monospace}
</style>
</head>
<body>
<div class="header">
<div class="logo" onclick="secretClick()">⭐ ELITE V17 - فروع مملكة إيليت 25 🏦</div>
<div id="authBtns" style="display:flex;gap:6px"><button class="btn btnD" onclick="openM('login')">دخول</button><button class="btn btnG" onclick="openM('reg')">تسجيل</button></div>
<div id="userMini" class="hidden" style="display:flex;gap:6px;align-items:center"><span id="miniName" class="badge"></span><button class="btn btnD" onclick="logout()">خروج</button></div>
</div>

<div class="wrap">
<!-- كل الفروع ظاهرة زي الصورة -->
<div id="guestBox">
<div class="card" style="text-align:center;border-color:#1e2a5a">
<div style="font-size:18px;color:#fff;font-weight:900">فروع مملكة إيليت 25 🗺️</div>
<div class="statTop"><span>👥 <b id="stUsers">0</b> عضو</span><span>💰 <b id="stBal">0</b> SDG</span><span>📦 <b id="stOrders">0</b> طلب</span></div>
</div>

<div class="card" style="background:#0f122a;border:1px solid #1e2a5a">
<div class="title2">فروع مملكة إيليت 25</div>
<div id="branchGrid" class="grid2"></div>
</div>
</div>

<div id="userBox" class="hidden">
<div class="card" style="text-align:center"><div style="color:#4ade80;font-weight:900">✅ تفاصيل حسابك</div>
<div class="tabs" id="mainTabs">
<div class="tab active" onclick="setView('settings',this)">⚙️ حسابي</div>
<div class="tab" onclick="setView('transfer',this)">💸 تحويل</div>
<div class="tab" onclick="setView('history',this)">💹 كشف</div>
<div class="tab" onclick="setView('store',this)">🛒 متجر</div>
<div class="tab" onclick="setView('orders',this)">📦 طلباتي</div>
<div class="tab" onclick="setView('branches',this)">🏦 كل الفروع 25</div>
<div class="tab" id="adminTabBtn" style="display:none;background:#ffaa0022" onclick="setView('admin',this)">👮 إدارة</div>
</div>
</div>
<div class="card"><div style="display:flex;justify-content:space-between"><div><div id="uName" style="font-weight:900"></div><div id="uInfo" style="margin-top:6px"></div></div><div style="text-align:left"><div id="uBal" style="font-size:20px;color:#f5c542;font-weight:900"></div><small id="uLevelTxt" style="color:#7a85b5"></small></div></div><div class="progress"><i id="uProg"></i></div><div id="uCardNum" style="margin-top:12px;background:#080e26;border:1px solid #1e2a5a;border-radius:14px;padding:12px;text-align:center"></div></div>
<div id="viewBox"></div>
</div>
</div>

<div id="mAuth" class="modal"><div class="sheet">
<div style="display:flex;justify-content:space-between"><b id="mTitle">تسجيل</b><button class="btn btnD" onclick="closeM()">X</button></div>
<div id="fReg" style="margin-top:10px">
<label class="label">📱 رقم العضوية * - يمنع التكرار</label><input id="rNumber" class="input" placeholder="091xxxxxxxx">
<label class="label">👤 الاسم *</label><input id="rName" class="input" placeholder="الاسم">
<label class="label">🔑 الباسورد *</label><input id="rPass" type="password" class="input" placeholder="4 أحرف على الأقل">
<label class="label">🏦 الفرع - 25 فرع - Select زي الصورة</label><div class="selectBox"><select id="rBranch" class="input" onchange="updateGuilds()" style="appearance:none;padding-left:28px"></select></div>
<label class="label">⚔️ النقابة</label><div class="selectBox"><select id="rGuild" class="input" style="appearance:none;padding-left:28px"></select></div>
<div id="regMsg" style="color:#ff6b6b;font-size:12px;text-align:center;margin-top:6px"></div>
<button class="btn btnG" style="width:100%;margin-top:8px" onclick="doReg()">إنشاء حساب 👑</button>
<small onclick="switchM('login')" style="color:#7a85b5;display:block;text-align:center;margin-top:10px;cursor:pointer">عندك حساب؟ دخول</small>
</div>
<div id="fLog" style="display:none;margin-top:10px">
<input id="lNumber" class="input" placeholder="رقم / اسم / حساب 5 أرقام">
<input id="lPass" type="password" class="input" placeholder="الباسورد">
<div id="loginMsg" style="color:#ff6b6b;font-size:12px;text-align:center"></div>
<button class="btn btnG" style="width:100%" onclick="doLog()">دخول 🔓</button>
<small onclick="switchM('reg')" style="color:#7a85b5;display:block;text-align:center;margin-top:10px;cursor:pointer">ما عندك حساب؟ سجل</small>
</div>
</div></div>

<div id="mAdminLock" class="modal"><div class="sheet"><div style="text-align:center"><b>🔒 إدارة مقفولة</b></div><br><input id="adminLockPass" type="password" class="input" placeholder="الباسورد المخفي" style="text-align:center"><button class="btn btnG" style="width:100%;margin-top:10px" onclick="unlockAdmin()">فتح 🔓</button><button class="btn btnD" style="width:100%;margin-top:8px" onclick="closeAdminLock()">إلغاء</button><div id="adminLockMsg" style="color:#ff6b6b;font-size:11px;text-align:center;margin-top:6px"></div></div></div>

<script>
const SALT='V17_ALL_BRANCHES_';
function hashPass(p){let s=SALT+p; let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i); h|=0;} return 'H$'+Math.abs(h).toString(16)+'$'+btoa(unescape(encodeURIComponent(p+SALT))).slice(0,22);}
function verifyPass(p,hash){return hashPass(p)===hash;}
function encodePass(p){return btoa(encodeURIComponent(p)).split('').reverse().join('');}
function decodePass(e){try{return decodeURIComponent(atob(e.split('').reverse().join('')));}catch{return '***';}}

const BRANCHES=[
{n:'طوكيو',i:'⛩️',g:['نقابة الساموراي','نقابة الأنمي','نقابة التنين']},
{n:'فلوكس',i:'🌟',g:['نقابة اللهب','نقابة البركان','نقابة الحمم']},
{n:'فويد',i:'🌌',g:['نقابة الفراغ','نقابة الثقب','نقابة الظلام']},
{n:'قولد',i:'🏆',g:['نقابة الذهب','نقابة الكنز','نقابة الملوك']},
{n:'كورال',i:'🔥',g:['نقابة المرجان','نقابة البحر','نقابة الموج']},
{n:'كيبوس',i:'💜',g:['نقابة البنفسج','نقابة الزهور','نقابة العطر']},
{n:'لافندر',i:'💜',g:['نقابة الخزامى','نقابة العطر','نقابة الربيع']},
{n:'لينوكس',i:'🧪',g:['نقابة الكود','نقابة التقنية','نقابة الهكر']},
{n:'مويرا',i:'🎲',g:['نقابة القدر','نقابة الحظ','نقابة النرد']},
{n:'نايت',i:'🌙',g:['نقابة الظل','نقابة القمر','نقابة الليل']},
{n:'داون',i:'🌇',g:['نقابة الغروب','نقابة الفجر','نقابة المساء']},
{n:'إسيلانور',i:'🍀',g:['نقابة الغابة','نقابة الطبيعة','نقابة الريح']},
{n:'دريفت',i:'🏜️',g:['نقابة الصحراء','نقابة السرعة','نقابة الرمال']},
{n:'رايكو',i:'🌧️',g:['نقابة المطر','نقابة العاصفة','نقابة السحاب']},
{n:'ريفيل',i:'☂️',g:['نقابة المظلة','نقابة الظلال','نقابة المطر']},
{n:'ستارك',i:'❄️',g:['نقابة الشتاء','نقابة الجليد','نقابة الذئب']},
{n:'ستورم',i:'🌪️',g:['نقابة الرعد','نقابة البرق','نقابة العاصفة']},
{n:'سكواد',i:'⬜',g:['نقابة الفريق','نقابة الجيش','نقابة الحرب']},
{n:'شيرو',i:'⚪',g:['نقابة النور','نقابة السلام','نقابة البياض']},
{n:'سيلاي',i:'❌',g:['نقابة الرفض','نقابة الحظر','نقابة المنع']},
{n:'أثينا',i:'❄️',g:['نقابة الحكمة','نقابة الثلج','نقابة الفكر']},
{n:'أولبيرا',i:'🦁',g:['نقابة الأسد','نقابة الزئير','نقابة الغابة']},
{n:'إسكدرا',i:'⭐',g:['نقابة النجوم','نقابة الفضاء','نقابة المجرة']},
{n:'اونيكس',i:'🌑',g:['نقابة الحجر','نقابة الظلام','نقابة الصخر']},
{n:'نوفا',i:'💥',g:['نقابة الانفجار','نقابة النوفا','نقابة الكون']}
];
const STORE_DATA=[
{id:1,n:'لقب إمبراطور',p:50000,icon:'👑',cat:'titles',desc:'رتبة إمبراطور 30 يوم',stock:99},
{id:2,n:'VIP ذهبي',p:25000,icon:'💎',cat:'vip',desc:'VIP 10%',stock:99},
{id:3,n:'حماية',p:10000,icon:'🛡️',cat:'protect',desc:'حماية 15 يوم',stock:99},
{id:4,n:'شحن 50K',p:35000,icon:'💰',cat:'balance',desc:'50K + 5K بونص',stock:999},
];
const DB_KEY='elite_v17_db', CUR_KEY='elite_cur_v17', ADMIN_KEY='adm_h_v17';
let cur=null, isAdminUnlocked=false, histFilter='all', secretClicks=0, storeCat='all';

function getDB(){try{let d=JSON.parse(localStorage.getItem(DB_KEY)||'{"users":[],"txs":[],"loans":[],"reqs":[],"orders":[],"notifs":[]}'); if(!d.store) d.store=STORE_DATA; if(!d.orders) d.orders=[]; if(!d.notifs) d.notifs=[]; if(!d.loans) d.loans=[]; if(!d.reqs) d.reqs=[]; if(!d.txs) d.txs=[]; return d;}catch(e){return {users:[],txs:[],loans:[],reqs:[],orders:[],notifs:[],store:STORE_DATA}}}
function saveDB(d){localStorage.setItem(DB_KEY,JSON.stringify(d));}
function getAdminHash(){let h=localStorage.getItem(ADMIN_KEY); if(!h){h=hashPass('ELITE2026'); localStorage.setItem(ADMIN_KEY,h);} return h;}
function gen5(){let DB=getDB(),n; do{n=Math.floor(10000+Math.random()*90000).toString();}while(DB.users.some(u=>u.acc5===n)); return n;}
function esc(s){let d=document.createElement('div'); d.innerText=s; return d.innerHTML;}

function secretClick(){secretClicks++; if(secretClicks>=5){secretClicks=0; document.getElementById('mAdminLock').classList.add('show');} setTimeout(()=>secretClicks=0,3000);}
function closeAdminLock(){document.getElementById('mAdminLock').classList.remove('show');}
function unlockAdmin(){let p=document.getElementById('adminLockPass').value; if(verifyPass(p,getAdminHash())||(cur&&cur.name.includes('ناغومو'))){isAdminUnlocked=true; closeAdminLock(); document.getElementById('adminTabBtn').style.display='block'; renderAdmin();}else{document.getElementById('adminLockMsg').innerText='❌ باسورد غلط';}}

function load(){
let DB=getDB();
document.getElementById('stUsers').innerText=DB.users.length;
document.getElementById('stBal').innerText=DB.users.reduce((s,u)=>s+u.bal,0).toLocaleString();
document.getElementById('stOrders').innerText=DB.orders.length;
let grid='';
// عرض كل الفروع زي الصورة - 25 فرع كلهم
BRANCHES.forEach(b=>{
let c=DB.users.filter(u=>u.branch===b.n).length;
let tot=DB.users.filter(u=>u.branch===b.n).reduce((s,u)=>s+u.bal,0);
grid+=`<div class="branch" onclick="selectBranch('${b.n}')"><b>${b.i} ${b.n}</b><small>${c} عضو • ${tot.toLocaleString()} SDG 0</small></div>`;
});
document.getElementById('branchGrid').innerHTML=grid;

let sel='<option value="" disabled selected>📍 اختر الفرع - 25 فرع</option>'; BRANCHES.forEach(b=>{sel+=`<option value="${b.n}">${b.i} ${b.n}</option>`;});
document.getElementById('rBranch').innerHTML=sel;
document.getElementById('rGuild').innerHTML='<option value="" disabled selected>⚔️ اختر النقابة</option>';
try{let s=JSON.parse(localStorage.getItem(CUR_KEY)||'null'); if(s){let me=DB.users.find(u=>u.acc5===s.acc5); if(me){cur=me; showUser();}}}catch(e){}
}
function selectBranch(name){document.getElementById('rBranch').value=name; updateGuilds(); openM('reg');}
function updateGuilds(){let bName=document.getElementById('rBranch').value; if(!bName) return; let br=BRANCHES.find(x=>x.n===bName); let h=''; if(br){br.g.forEach((g,idx)=>{h+=`<option value="${g}" ${idx===0?'selected':''}>⚔️ ${g}</option>`;});} document.getElementById('rGuild').innerHTML=h;}
function getLevel(b){if(b>=1000000) return {n:'إمبراطور',p:100}; if(b>=500000) return {n:'ملك',p:80}; if(b>=200000) return {n:'قولد',p:60}; if(b>=100000) return {n:'سيلفر',p:40}; if(b>=50000) return {n:'برونز',p:20}; return {n:'عضو',p:10};}
function openM(t){document.getElementById('mAuth').classList.add('show'); document.getElementById('mTitle').innerText=t==='reg'?'تسجيل - 25 فرع':'دخول'; document.getElementById('fReg').style.display=t==='reg'?'block':'none'; document.getElementById('fLog').style.display=t==='reg'?'none':'block';}
function closeM(){document.getElementById('mAuth').classList.remove('show');}
function switchM(t){openM(t);}
function showUser(){
document.getElementById('guestBox').classList.add('hidden');
document.getElementById('userBox').classList.remove('hidden');
document.getElementById('authBtns').classList.add('hidden');
document.getElementById('userMini').classList.remove('hidden');
document.getElementById('miniName').innerText='👑 '+esc(cur.name);
let lv=getLevel(cur.bal);
document.getElementById('uName').innerText=cur.name+' ('+cur.number+')';
document.getElementById('uInfo').innerHTML=`<span class="badge">🏦 ${cur.acc5}</span> <span class="badge">${esc(cur.branch)}</span>`;
document.getElementById('uBal').innerText=cur.bal.toLocaleString()+' SDG';
document.getElementById('uLevelTxt').innerText=lv.n;
document.getElementById('uProg').style.width=lv.p+'%';
document.getElementById('uCardNum').innerHTML=`<div style="color:#7a85b5;font-size:10px">رقم حسابك 5 أرقام</div><div style="font-size:26px;font-weight:900;letter-spacing:6px;color:#f5c542;margin:8px 0;cursor:pointer" onclick="copyAcc()">${cur.acc5.split('').join(' ')} 📋</div><div style="display:flex;justify-content:space-between;font-size:11px;color:#7a85b5"><span>SN:${cur.sn}</span><span>TC:${cur.tc}</span></div>`;
setView('settings');
}
function copyAcc(){navigator.clipboard.writeText(cur.acc5); alert('تم نسخ: '+cur.acc5);}
function setView(v,el){
if(v==='admin'){if(!isAdminUnlocked){document.getElementById('mAdminLock').classList.add('show'); return;} renderAdmin(); if(el) activateTab(el); return;}
if(el) activateTab(el);
let DB=getDB(); let html='';
if(v==='settings'){html=`<div class="card"><div class="title2">⚙️ حسابي</div><div class="item"><div><b>👤 ${esc(cur.name)}</b></div><button class="btn btnD" onclick="editField('name')">تعديل</button></div><div class="item"><div><b>📱 ${esc(cur.number)}</b></div><button class="btn btnD" onclick="editField('number')">تعديل</button></div><div class="item"><div><b>🏦 ${cur.acc5}</b></div><button class="btn btnD" onclick="copyAcc()">نسخ</button></div><div class="item"><div><b>💰 ${cur.bal.toLocaleString()} - ${getLevel(cur.bal).n}</b></div></div></div>`;}
else if(v==='transfer'){html=`<div class="card"><div class="title2">💸 تحويل عبر 5 أرقام</div><input id="toAcc5" class="input" placeholder="رقم الحساب 5 أرقام"><input id="toAmt" type="number" class="input" placeholder="المبلغ"><button class="btn btnG" style="width:100%" onclick="doTrans()">تحويل ⚡</button><br><br><small id="transMsg" style="color:#ff6b6b"></small></div>`;}
else if(v==='history'){html=`<div class="card"><div class="title2">💹 كشف حساب</div><div id="histList"></div></div>`; setTimeout(()=>filterHist('all'),50);}
else if(v==='store'){html=`<div class="card"><div class="title2">🛒 متجر المملكة</div><div id="storeGrid" class="grid2"></div></div>`; setTimeout(loadStoreGrid,50);}
else if(v==='orders'){html=`<div class="card"><div class="title2">📦 طلباتي</div><div id="ordersList"></div></div>`; setTimeout(loadOrdersList,50);}
else if(v==='branches'){
let allGrid='';
BRANCHES.forEach(b=>{
let c=DB.users.filter(u=>u.branch===b.n).length;
let tot=DB.users.filter(u=>u.branch===b.n).reduce((s,u)=>s+u.bal,0);
allGrid+=`<div class="branch" style="padding:18px 8px"><b>${b.i} ${b.n}</b><small>${c} عضو • ${tot.toLocaleString()} SDG</small><br><small style="color:#f5c54266;font-size:9px">${b.g[0]}</small></div>`;
});
html=`<div class="card" style="background:#0f122a"><div class="title2">فروع مملكة إيليت 25 - كل الفروع ظاهرة زي الصورة</div><div class="grid2">${allGrid}</div></div>`;
}
document.getElementById('viewBox').innerHTML=html;
}
function activateTab(el){document.querySelectorAll('#mainTabs .tab').forEach(t=>t.classList.remove('active')); el.classList.add('active');}
function loadStoreGrid(){let DB=getDB(); let html=''; DB.store.forEach(s=>{html+=`<div class="branch"><b>${s.icon} ${s.n}</b><br><small>${s.desc}</small><br><b style="color:#f5c542">${s.p.toLocaleString()}</b><br><button class="btn btnG" style="padding:6px 12px;margin-top:6px" onclick="buyStore(${s.id})">شراء</button></div>`;}); let el=document.getElementById('storeGrid'); if(el) el.innerHTML=html;}
function loadOrdersList(){let DB=getDB(); let my=DB.orders.filter(o=>o.acc5===cur.acc5); let html=''; if(!my.length) html='<div style="text-align:center;color:#7a85b5;padding:20px">لا طلبات</div>'; my.forEach(o=>{html+=`<div class="itemFull"><b>${o.icon} ${esc(o.name)}</b> - ${esc(o.status)}<br><small>${o.price.toLocaleString()} SDG - ${new Date(o.date).toLocaleString()}</small></div>`;}); let el=document.getElementById('ordersList'); if(el) el.innerHTML=html;}
function renderAdmin(){
let DB=getDB();
let html=`<div class="card" style="border-color:#f5c54288"><div class="title2">👮 إدارة - كل الفروع</div>
<div style="background:#0e1430;padding:10px;border-radius:12px;font-size:11px">إجمالي: ${DB.users.length} | السيولة: ${DB.users.reduce((s,u)=>s+u.bal,0).toLocaleString()} | طلبات: ${DB.orders.length}</div><br>
<div class="tabs"><div class="tab active" onclick="setAdminTab('accounts',this)">👥 حسابات</div><div class="tab" onclick="setAdminTab('branchesA',this)">🏦 كل الفروع 25</div><div class="tab" onclick="setAdminTab('ordersA',this)">📦 طلبات</div></div>
<div id="adminBox"></div></div>`;
document.getElementById('viewBox').innerHTML=html; setAdminTab('accounts');
}
function setAdminTab(t,el){
let DB=getDB(),html='';
if(t==='branchesA'){
let g=''; BRANCHES.forEach(b=>{let c=DB.users.filter(u=>u.branch===b.n).length; let tot=DB.users.filter(u=>u.branch===b.n).reduce((s,u)=>s+u.bal,0); g+=`<div class="branch"><b>${b.i} ${b.n}</b><br><small>${c} عضو • ${tot.toLocaleString()} SDG</small></div>`;});
html=`<div class="card" style="background:#0f122a"><div class="title2">فروع مملكة إيليت 25 - كل الفروع ظاهرة</div><div class="grid2">${g}</div></div>`;
}
else if(t==='accounts'){
DB.users.forEach((u,idx)=>{html+=`<div class="itemFull"><div><b>👤 ${esc(u.name)}</b> - ${esc(u.branch)} - ${u.acc5} - ${u.bal.toLocaleString()}<br><small>📱 ${esc(u.number)} | 🔑 <span id="pass_${idx}">••••••••</span> <span style="cursor:pointer;background:#f5c54222;padding:2px 6px;border-radius:6px" onclick="togglePassAdmin(${idx},'${u.passEnc}')">👁️</span></small></div><div style="display:flex;gap:4px"><button class="btn btnD" style="padding:4px 6px" onclick="addBal('${u.acc5}',10000)">+10K</button><button class="btn btnD" style="padding:4px 6px;background:#ff000044" onclick="delU('${u.acc5}')">حذف</button></div></div>`;});
if(!DB.users.length) html='لا حسابات';
}
else if(t==='ordersA'){
DB.orders.forEach((o,i)=>{html+=`<div class="itemFull"><b>${o.icon} ${esc(o.name)} - ${esc(o.user)}</b> - ${o.price.toLocaleString()} - ${esc(o.status)}</div>`;});
if(!DB.orders.length) html='لا طلبات';
}
document.getElementById('adminBox').innerHTML=html;
if(el){el.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); el.classList.add('active');}
}
function togglePassAdmin(idx,enc){let el=document.getElementById('pass_'+idx); if(el.innerHTML.includes('••••')){el.innerHTML=esc(decodePass(enc));}else{el.innerHTML='••••••••';}}
function doReg(){
let number=document.getElementById('rNumber').value.trim(),name=document.getElementById('rName').value.trim(),pass=document.getElementById('rPass').value.trim();
let branch=document.getElementById('rBranch').value, guild=document.getElementById('rGuild').value;
let msg=document.getElementById('regMsg'); msg.innerText='';
if(!number||!name||!pass){msg.innerText='❌ الرقم والاسم والباسورد مطلوبة'; return;}
if(pass.length<4){msg.innerText='❌ 4 أحرف على الأقل'; return;}
if(!branch){msg.innerText='❌ اختر الفرع'; return;}
if(!guild){msg.innerText='❌ اختر النقابة'; return;}
let DB=getDB();
if(DB.users.some(u=>u.number===number)){msg.innerText='❌ الرقم موجود - يمنع تكرار نفس الرقم'; return;}
if(DB.users.some(u=>u.name===name)){msg.innerText='❌ الاسم موجود'; return;}
let acc5=gen5(),tc=Math.floor(10000+Math.random()*90000).toString(),sn='ELITE-'+(1000+DB.users.length);
let passHash=hashPass(pass); let passEnc=encodePass(pass);
let u={number,name,passHash,passEnc,acc5,tc,sn,branch,guild,bal:50000,frozen:false,banned:false,date:Date.now()};
DB.users.push(u); saveDB(DB); cur=u; localStorage.setItem(CUR_KEY,JSON.stringify(cur)); closeM(); load();
}
function doLog(){let num=document.getElementById('lNumber').value.trim(),pass=document.getElementById('lPass').value.trim(); let msg=document.getElementById('loginMsg'); msg.innerText=''; let DB=getDB(); let f=DB.users.find(u=>u.number===num||u.name===num||u.acc5===num); if(!f){msg.innerText='❌ غير موجود'; return;} if(!verifyPass(pass,f.passHash)){msg.innerText='❌ باسورد غلط'; return;} if(f.banned){msg.innerText='🚫 محظور'; return;} if(f.frozen){msg.innerText='❄️ مجمد'; return;} cur=f; localStorage.setItem(CUR_KEY,JSON.stringify(cur)); closeM(); load();}
function editField(field){let DB=getDB(),u=DB.users.find(x=>x.acc5===cur.acc5); if(field==='name'){let v=prompt('اسم جديد:',u.name); if(v) u.name=v;} if(field==='number'){let v=prompt('رقم جديد:',u.number); if(v){if(DB.users.some(x=>x.number===v&&x.acc5!==u.acc5)){alert('الرقم موجود'); return;} u.number=v;}} if(field==='pass'){let v=prompt('باسورد جديد:'); if(v){u.passHash=hashPass(v); u.passEnc=encodePass(v);}} saveDB(DB); cur=u; localStorage.setItem(CUR_KEY,JSON.stringify(cur)); load(); setView('settings');}
function doTrans(){let toAcc=document.getElementById('toAcc5').value.trim(),amt=parseInt(document.getElementById('toAmt').value),DB=getDB(),from=DB.users.find(u=>u.acc5===cur.acc5); if(!/^\d{5}$/.test(toAcc)){alert('لازم 5 أرقام');return;} let toU=DB.users.find(u=>u.acc5===toAcc); if(!toU){alert('غير موجود');return;} if(!amt||amt<=0){alert('مبلغ غلط');return;} if(from.bal<amt){alert('لا يكفي');return;} from.bal-=amt; toU.bal+=amt; DB.txs.unshift({from:from.name,fromAcc:from.acc5,to:toU.name,toAcc:toU.acc5,amt,date:Date.now(),ref:'REF-'+Date.now().toString().slice(-6)}); saveDB(DB); cur=from; localStorage.setItem(CUR_KEY,JSON.stringify(cur)); load(); alert('تم');}
function filterHist(f){let DB=getDB(),list=DB.txs.filter(t=>t.fromAcc===cur.acc5||t.toAcc===cur.acc5); let html=''; list.forEach(t=>{let isOut=t.fromAcc===cur.acc5; html+=`<div class="item"><div><b>${isOut?'صادر إلى '+esc(t.to):'وارد من '+esc(t.from)}</b></div><div>${isOut?'-':'+'}${t.amt}</div></div>`;}); if(!html) html='لا عمليات'; document.getElementById('histList').innerHTML=html;}
function buyStore(id){let DB=getDB(),u=DB.users.find(x=>x.acc5===cur.acc5),s=DB.store.find(x=>x.id===id); if(!s) return; if(u.bal<s.p){alert('لا يكفي');return;} u.bal-=s.p; DB.orders.push({acc5:u.acc5,user:u.name,name:s.n,icon:s.icon,price:s.p,status:'✅ تم',date:Date.now()}); saveDB(DB); cur=u; localStorage.setItem(CUR_KEY,JSON.stringify(cur)); load(); alert('تم شراء '+s.n);}
function addBal(acc5,amt){let DB=getDB(),u=DB.users.find(x=>x.acc5===acc5); if(u){u.bal+=amt; saveDB(DB); load(); if(isAdminUnlocked) renderAdmin(); if(cur&&cur.acc5===acc5){cur=u; localStorage.setItem(CUR_KEY,JSON.stringify(cur));}}}
function delU(acc5){if(!confirm('حذف؟')) return; let DB=getDB(); DB.users=DB.users.filter(u=>u.acc5!==acc5); saveDB(DB); load(); if(cur&&cur.acc5===acc5) logout(); else if(isAdminUnlocked) renderAdmin();}
function logout(){localStorage.removeItem(CUR_KEY); cur=null; isAdminUnlocked=false; document.getElementById('userBox').classList.add('hidden'); document.getElementById('guestBox').classList.remove('hidden'); document.getElementById('authBtns').classList.remove('hidden'); document.getElementById('userMini').classList.add('hidden'); document.getElementById('adminTabBtn').style.display='none'; load();}

load();
</script>
